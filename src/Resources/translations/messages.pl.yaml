    ui:
        indexable_attribute_header: 'Indeksowane atrybuty'
        indexable_attribute_help: |
            <h4>Indexed attributes</h4>
            <p>Choose which product attributes are sent to Meilisearch and how they can be used:</p>
            <ul>
                <li><strong>Searchable</strong>: the search query matches against the values of the attribute.</li>
                <li><strong>Filterable</strong>: the field can be used in filters.</li>
                <li><strong>Facetable</strong>: the field is shown as a filter with counts on the search page. A facetable field is always filterable as well.</li>
            </ul>
            <p>The configuration applies per index, so you can e.g. include an attribute in your main product index while leaving another index untouched.</p>
            <p>Saving automatically updates the index settings and reindexes the affected indexes. Note that date attributes cannot be shown as facets.</p>
        indexable_attribute_subheader: 'Skonfiguruj, które atrybuty produktu są indeksowane'
        indexable_option_header: 'Indeksowane opcje'
        indexable_option_help: |
            <h4>Indexed options</h4>
            <p>Choose which product options are sent to Meilisearch and how they can be used:</p>
            <ul>
                <li><strong>Searchable</strong>: the search query matches against the option values of the product's variants.</li>
                <li><strong>Filterable</strong>: the field can be used in filters.</li>
                <li><strong>Facetable</strong>: the field is shown as a filter with counts on the search page. A facetable field is always filterable as well.</li>
            </ul>
            <p>The configuration applies per index, so you can e.g. include an option in your main product index while leaving another index untouched.</p>
            <p>Saving automatically updates the index settings and reindexes the affected indexes.</p>
        indexable_option_subheader: 'Skonfiguruj, które opcje produktu są indeksowane'
        indexes: Indexes
        no_indexes: No indexes
        search: Search
        search_placeholder: Search...
        search_results_for: 'Search results for'
        search_term_and_synonym: 'Search term and synonym'
        synonym: Synonym
        synonym_header: Synonyms
        synonym_help: |
            <h4>Understanding synonyms</h4>
            <p>Synonyms are words or phrases that have the same or similar meaning. For example, if you add the synonym "jacket" to the term "coat", then when a user searches for "coat", the search results will include results matching "jacket".</p>
            <p>If the direction is "one way", then the synonym will only work in one direction. For example, if the term is "coat" and the synonym is "jacket", then when a user searches for "coat", the search results will include results matching "jacket". However, if the direction is "two way", then the synonym will work in both directions. For example when a user searches for "jacket", the search results will include results matching "coat", and when a user searches for "coat", the search results will include results matching "jacket".</p>
        synonym_subheader: Manage synonyms
        synonyms: Synonyms
        term: Term
